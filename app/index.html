<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#20242a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>macbeth</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <script type="module" crossorigin src="/macbethUnity/app/assets/app-eSn6G_A0.js"></script>
  <link rel="stylesheet" crossorigin href="/macbethUnity/app/assets/app-BeGP0aFZ.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><b>macbeth</b></div>
    <button class="modebtn" id="modeBtn">
      <span id="modeLabel">モデリング</span><span class="caret">▼</span>
    </button>
    <button class="topbtn" id="fileBtn" title="新規 / 開く / 保存 / OBJ">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/></svg>
      ファイル <span class="caret">▼</span>
    </button>
    <div class="topspacer"></div>
    <button class="topbtn" id="btnPanels" aria-pressed="false">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M9 4v16"/></svg>
      パネル
    </button>
    <div class="topnote" id="saveNote"></div>
  </div>

  <div class="stage" id="stage">
    <div class="rail">
      <div class="gwrap">
        <div class="glabel" id="g1lbl">強度</div>
        <div class="gauge" id="gauge1"><div class="fill"></div><div class="knob"></div></div>
        <div class="gval" id="g1val">0.00</div>
      </div>
      <div class="hbtns">
        <button class="bigbtn" id="btnUndo" title="一つ前に戻る (Ctrl+Z)" disabled>
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-4"/></svg>
        </button>
        <button class="bigbtn" id="btnRedo" title="一つ先に進む (Ctrl+Shift+Z)" disabled>
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h4"/></svg>
        </button>
      </div>
      <div class="gwrap">
        <div class="glabel" id="g2lbl">範囲</div>
        <div class="gauge" id="gauge2"><div class="fill"></div><div class="knob"></div></div>
        <div class="gval" id="g2val">1.00</div>
      </div>
    </div>

    <div class="dock narrow" id="dockLeft" data-zone="left"></div>

    <div class="vp" id="vp">
      <canvas id="gl"></canvas>
      <div class="marquee" id="marquee"></div>
      <div class="hud hud-stats" id="hudStats"></div>
      <div class="hud hud-mode" id="hudMode"></div>
      <div class="hud hud-hint" id="hudHint"></div>
      <div class="cluster">
        <button class="cmod" id="modShift" data-state="off">SHF</button>
        <button class="cframe" id="btnFrame" title="タップで選択をフレーム (F)。押しながらドラッグで矩形選択、押しながらピンチで選択中心へズーム">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="3"/></svg>
          <small>F</small>
        </button>
        <button class="cmod" id="modCtrl" data-state="off">CTL</button>
        <button class="cmod" id="modAlt" data-state="off">ALT</button>
      </div>
    </div>

    <div class="dockcol" id="dockColRight">
      <div class="dock dock-right" id="dockRightTop" data-zone="rightTop"></div>
      <div class="dock dock-right" id="dockRightBottom" data-zone="rightBottom"></div>
    </div>
  </div>
</div>
</body>
</html>
