name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: 型検査
        run: npm run typecheck
      - name: テスト
        run: npm test
      - name: ビルド
        run: npm run build
      - name: ブラウザを入れる
        run: npx playwright install --with-deps chromium
      - name: 実機相当の通し確認
        # 実際の Chromium で描画・選択・取り消し・自動保存まで通す
        run: npm run smoke
      - name: 画面の写真を残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: smoke.png
          if-no-files-found: ignore
