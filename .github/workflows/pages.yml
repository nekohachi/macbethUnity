name: Deploy to GitHub Pages

# Pages の Source が「GitHub Actions」のときに使うもの。
#
# 現状このリポジトリでは Pages 自体がまだ有効になっていない（configure-pages が
# Get Pages site: Not Found を返す）。enablement: true での自動有効化も試したが、
# サイトの新規作成は管理者権限が要るため GITHUB_TOKEN では
# "Resource not accessible by integration" で通らない。最初の 1 回だけは
# 人が Settings → Pages で有効にする必要がある。
#
# いまの配信はブランチ配信 + publish.yml（app/ をブランチへ書き戻す）が担うので、
# ここは手動起動だけにしてある。Source を「GitHub Actions」にしたら
# on: を push に戻すこと。
#
# 出すもの:
#   /            プロトタイプ（移植が終わるまでの入口）
#   /app/        新しいシェル（タブレットはこちら）
#   /app.html    同じものの別名。前に案内した URL を生かしておくため
#   /prototype/  プロトタイプの単体ページ
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: 型検査とテスト
        run: |
          npm run typecheck
          npm test

      - name: 新しいシェルを /app/ 用にビルドする
        env:
          MACBETH_PAGES_PATH: /${{ github.event.repository.name }}/app/
        run: sh scripts/publish.sh

      - name: ブラウザを入れる
        run: npx playwright install --with-deps chromium

      - name: 壊れていないか通しで確かめる
        # 出す前に、実際の Chromium で描画・選択・取り消し・自動保存まで通す
        run: node scripts/smoke.mjs app

      - name: 公開するものを組み立てる
        run: |
          rm -rf site
          mkdir -p site
          # トップは移植が終わるまでプロトタイプのまま
          cp index.html site/index.html
          mkdir -p site/prototype
          cp prototype/modeling-ui-prototype.html site/prototype/
          # 新しいシェル
          cp -r app site/app
          # 前に案内した /app.html でも開けるようにしておく
          cp app/index.html site/app.html
          # Jekyll に通さない（_ で始まる名前などを勝手に落とさせない）
          touch site/.nojekyll
          ls -R site | head -40

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
