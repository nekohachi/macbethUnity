name: Deploy to GitHub Pages

# タブレットで常に最新を開けるように、push のたびに Pages へ出す。
# 手動の prototype/make-pages.sh はこれに置き換わる。
on:
  push:
    branches: ["claude/tablet-3d-modeling-app-f6b1x5", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: 型検査とテスト
        run: |
          npm run typecheck
          npm test
      - name: ビルド
        env:
          MACBETH_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - name: プロトタイプを同梱する（新しいシェルが揃うまでの入口）
        run: |
          # 移植が済むまで、Pages のトップはプロトタイプのまま。
          # 新しいシェルは /app.html で確認できる。
          cp index.html dist/index.html
          mkdir -p dist/prototype
          cp prototype/modeling-ui-prototype.html dist/prototype/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
